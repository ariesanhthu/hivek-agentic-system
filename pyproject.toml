[project]
name = "hivek-agentic-system"
version = "0.1.0"
description = "HIVE-K agentic harness: stateful content operations for multi-account social workspaces."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.118,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "sse-starlette>=2.1,<4",
    "langgraph>=1.0,<2",
    # Durable checkpoints: without this a paused run dies with the worker.
    "langgraph-checkpoint-mongodb>=0.4,<1",
    "pymongo>=4.13,<5",
    "google-genai>=1.0,<3",
    "python-dotenv>=1.0,<2",
    "httpx>=0.27,<1",
    "cryptography>=44,<47",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<2",
    "ruff>=0.6,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hivek_agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
# FastAPI's documented idiom is `param = Depends(...)` in the signature; B008 flags it
# as a mutable-default call, which does not apply here.
"src/hivek_agent/api/*.py" = ["B008"]
